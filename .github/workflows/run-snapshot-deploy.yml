name: Run Snapshot Deploy
permissions:
  contents: read
on:
  workflow_dispatch:

jobs:
  test-snapshot:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'liberica'
          cache: 'maven'
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          mvn-server-repository-origins: central:https://central.sonatype.com
          gpg-private-key: ${{ env.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Verify Version is SNAPSHOT
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ ! "$VERSION" =~ -SNAPSHOT$ ]]; then
            echo "Error: Version must end with -SNAPSHOT for snapshot deployment"
            echo "Current version: $VERSION"
            exit 1
          fi
          echo "✅ Version is SNAPSHOT: $VERSION"

      - name: Run Tests
        run: mvn --batch-mode clean verify

      - name: Deploy Snapshot
        run: mvn --batch-mode deploy -Prelease -DskipTests

      - name: Summary
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "✅ Successfully deployed snapshot!"
          echo ""
          echo "📦 Artifact: io.github.prasanna0586:spring-data-dynamodb:$VERSION"
          echo ""
          echo "🔍 Verify at:"
          echo "https://central.sonatype.com/artifact/io.github.prasanna0586/spring-data-dynamodb/$VERSION"
          echo ""
          echo "⚠️  Snapshots may take a few minutes to appear in Maven Central"
